name: E7 source audit synthetic checks
on:
  push:
    paths:
      - 'research/E7_CICIDS2017/scripts/**'
      - 'research/E7_CICIDS2017/tests/**'
      - 'research/E7_CICIDS2017/configs/**'
      - 'research/E7_CICIDS2017/notebooks/30_e7_g3_openworld_dayholdout_b012_lightgbm.ipynb'
      - 'research/E7_CICIDS2017/notebooks/30b_e7_g3_recovery.ipynb'
      - '.github/workflows/e7_source_audit_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit test dependencies
        run: python -m pip install -q numpy pandas pytest scikit-learn lightgbm
      - name: Run synthetic source and GitHub archive regression tests
        run: python -m pytest -q research/E7_CICIDS2017/tests/test_e7_g0_external_source_audit.py research/E7_CICIDS2017/tests/test_e7_g0_publish.py research/E7_CICIDS2017/tests/test_e7_g0_timestamp_registry.py research/E7_CICIDS2017/tests/test_e7_g0_publish_v2.py research/E7_CICIDS2017/tests/test_e7_g0_extended_audit.py research/E7_CICIDS2017/tests/test_e7_csv_encoding_gate.py research/E7_CICIDS2017/tests/test_e7_g1_label_clock_diagnostic.py research/E7_CICIDS2017/tests/test_e7_g2_source_clock_forensics.py research/E7_CICIDS2017/tests/test_e7_g2_publish.py research/E7_CICIDS2017/tests/test_e7_g3_openworld_baseline.py research/E7_CICIDS2017/tests/test_e7_g3_archive.py research/E7_CICIDS2017/tests/test_e7_g3_archive_v2.py
      - name: Parse and compile all overnight Notebook 27 and 27B and 27C Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in (
              '27_e7_overnight_full_audit_verified_github_sync.ipynb',
              '27b_e7_overnight_resume_strict_encoding_and_github_sync.ipynb',
              '27c_e7_overnight_resume_corrected_preflight.ipynb',
              '27d_e7_resume_label_sentinel_audit.ipynb',
              '28_e7_g1_label_clock_source_diagnostic.ipynb',
              '29_e7_g2_source_integrity_clock_forensics.ipynb',
              '30_e7_g3_openworld_dayholdout_b012_lightgbm.ipynb',
              '30b_e7_g3_recovery.ipynb',
          ):
              p=Path('research/E7_CICIDS2017/notebooks')/filename
              notebook=json.loads(p.read_text(encoding='utf-8'))
              cells=[c for c in notebook['cells'] if c['cell_type']=='code']
              assert len(cells)==(3 if filename.startswith(('28_','29_')) else 4), 'Unexpected notebook code cell count'
              for i,cell in enumerate(cells,1):
                  source=''.join(cell['source'])
                  compile(source,str(p)+f':cell-{i}','exec')
              print('PASS:',filename,'all',len(cells),'Python cells compile')
          PY

      - name: Verify Notebook 30 pinned blob hashes against committed research source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          base=Path('research/E7_CICIDS2017')
          notebook=json.loads((base/'notebooks/30_e7_g3_openworld_dayholdout_b012_lightgbm.ipynb').read_text())
          source=''.join(next(c['source'] for c in notebook['cells'] if c['cell_type']=='code' and any('BLOBS={' in v for v in c['source'])))
          assert 'COMMIT="855baa3f8dc426cc838ae48c8df5b4c7da85f203"' in source
          paths={
           'scripts/e7_g3_openworld_baseline.py':'f882154ff9757abe66a7fe588039eb26c9758170',
           'scripts/e7_g3_archive.py':'348e54e8ad719f544ab51608d364b504e8d26744',
           'configs/G3_OPENWORLD_DAYHOLDOUT_PROTOCOL_001.json':'5ca597207bd8379860a3007b6cb7952efdde9b4f',
           'configs/G3_B012_HYPERPARAMETER_LOCK_001.json':'abd380bdbcab38ea3b33c1637457ffca44ef253e'}
          for name,expected in paths.items():
              raw=(base/name).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
              assert actual==expected,(name,actual,expected)
              assert expected in source
          print('PASS: Notebook 30 exact pinned code and frozen protocol SHA values match GitHub')
          PY
