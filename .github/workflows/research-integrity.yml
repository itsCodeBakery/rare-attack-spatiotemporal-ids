name: Research integrity checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - name: Check out versioned research code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=1.26,<3" "pytest>=8,<10" "requests>=2.31,<3"

      - name: Compile research code and synthetic tests
        run: python -m compileall -q src scripts tests

      - name: Run synthetic integrity tests
        run: python -m pytest -q tests

      - name: Validate Kaggle notebook JSON and Python cell syntax
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          for path in sorted(Path("notebooks").glob("*.ipynb")):
              nb = json.loads(path.read_text(encoding="utf-8"))
              for i, cell in enumerate(nb["cells"]):
                  if cell["cell_type"] == "code":
                      try:
                          ast.parse("".join(cell["source"]))
                      except SyntaxError as exc:
                          raise SystemExit(f"{path} code cell {i} invalid: {exc}")
              print(f"Checked {path}")
          PY
